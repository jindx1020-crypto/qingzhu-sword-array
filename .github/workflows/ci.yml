name: Verify release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The checkout folder contains a space and CJK characters so path-encoding regressions fail here first.
    defaults:
      run:
        working-directory: 'qingzhu 青竹/game'
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'qingzhu 青竹'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'qingzhu 青竹/game/package-lock.json'
      - run: npm ci
      - name: Read game version
        id: version
        run: node --input-type=module -e "import {GAME_VERSION} from './gameplay/version.js';console.log('version='+GAME_VERSION);" >> "$GITHUB_OUTPUT"
      # High and critical advisories fail unless registered in scripts/audit-gate.mjs as still unfixed upstream.
      - run: npm run audit:gate
      - run: npm run check
      - run: npm run build
      # Intro generation updates the public narration source before source packaging.
      - run: npm run build:intro
      - run: npm run build:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:intro
      - run: npm run test:browser
      - run: npm run test:player
      - run: npm run check:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: 'qingzhu 青竹/game/qa/'
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qingzhu-${{ steps.version.outputs.version }}
          path: 'qingzhu 青竹/release/${{ steps.version.outputs.version }}/'
          if-no-files-found: error
